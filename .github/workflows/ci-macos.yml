# macOS is one of three platform workflows -- ci-linux.yml, ci-macos.yml and
# ci-windows.yml -- rather than a matrix in one file, so that each platform
# gets its own status badge.  GitHub's badge endpoint reports a whole
# workflow and silently ignores a ?job= parameter, so a matrix leg cannot be
# badged on its own; splitting the files is the only way to make the three
# badges in README.md mean what they appear to mean.
#
# What this one is for: libcurl's setopt/getinfo are variadic, and Darwin
# arm64 passes a variadic argument on the stack where x86-64 SysV passes it
# in a register.  An ordinary CFFI call therefore hands libcurl garbage here
# and works on Linux, so this is the job that proves the libffi path in
# src/varargs.lisp is doing something.  It also picks up whichever libcurl
# the runner resolves -- Homebrew's or the older one in the dyld shared
# cache -- which decides whether the websocket suite runs or skips.

name: macOS

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: sbcl · macos-latest
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install SBCL and libcurl
        run: brew install sbcl curl

      - name: Install and configure ocicl
        run: |
          # Clone the ocicl *tool* outside the repo so it does not collide with
          # this project's gitignored ocicl/ dependency directory.
          git clone --depth 1 https://github.com/ocicl/ocicl.git "$HOME/ocicl-src"
          ( cd "$HOME/ocicl-src" && sbcl --non-interactive --load setup.lisp )
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore dependencies
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ocicl setup
          ocicl install

      - name: Report which libcurl was loaded
        # Worth its own step: the binding feature-gates on the loaded library,
        # and on macOS it may resolve either the Homebrew build or the older
        # one in the dyld shared cache.  When a test skips, this says why.
        run: |
          sbcl --non-interactive \
            --load "$HOME/.local/share/ocicl/ocicl-runtime.lisp" \
            --eval '(asdf:initialize-source-registry (list :source-registry (list :directory (uiop:getcwd)) :inherit-configuration))' \
            --eval '(asdf:load-system :curlcl)' \
            --eval '(format t "~&libcurl ~A at ~A~%protocols: ~A~%features: ~A~%" (curlcl:libcurl-version) (curlcl:libcurl-pathname) (curlcl:libcurl-protocols) (curlcl:libcurl-features))'

      # Built before the tests, because the CLI suite runs the real binary and
      # skips the end-to-end cases when it is missing.
      - name: Build the executable
        run: |
          sbcl --non-interactive \
            --load "$HOME/.local/share/ocicl/ocicl-runtime.lisp" \
            --eval '(asdf:initialize-source-registry (list :source-registry (list :directory (uiop:getcwd)) :inherit-configuration))' \
            --eval '(asdf:make :curlcl/cli)'
          ./bin/curlcl -V
          ./bin/curlcl -s -o /dev/null -w 'smoke: %{http_code} in %{time_total}s\n' https://example.com/

      - name: Run tests
        run: |
          sbcl --non-interactive \
            --load "$HOME/.local/share/ocicl/ocicl-runtime.lisp" \
            --eval '(asdf:initialize-source-registry (list :source-registry (list :directory (uiop:getcwd)) :inherit-configuration))' \
            --eval '(asdf:load-system :curlcl/test)' \
            --eval '(uiop:quit (if (curlcl/test:run-tests) 0 1))'
