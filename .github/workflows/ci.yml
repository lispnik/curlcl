name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: sbcl · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      # Both platforms are in the matrix for a specific reason: libcurl's
      # setopt/getinfo are variadic, and how the variadic argument is passed
      # differs between x86-64 SysV (registers) and Darwin arm64 (stack).  The
      # macOS runner is what proves the libffi path in src/varargs.lisp is
      # actually necessary; the Linux runner proves it did not break the case
      # that would have worked anyway.
      - name: Install SBCL and libcurl
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            # libffi-dev and pkg-config are for cffi-libffi's grovel step.
            sudo apt-get install -y sbcl libcurl4-openssl-dev libffi-dev pkg-config
          else
            brew install sbcl curl
          fi

      - name: Install and configure ocicl
        run: |
          # Clone the ocicl *tool* outside the repo so it does not collide with
          # this project's gitignored ocicl/ dependency directory.
          git clone --depth 1 https://github.com/ocicl/ocicl.git "$HOME/ocicl-src"
          ( cd "$HOME/ocicl-src" && sbcl --non-interactive --load setup.lisp )
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore dependencies
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ocicl setup
          ocicl install

      - name: Report which libcurl was loaded
        # Worth its own step: the binding feature-gates on the loaded library,
        # and on macOS it may resolve either the Homebrew build or the older
        # one in the dyld shared cache.  When a test skips, this says why.
        run: |
          sbcl --non-interactive \
            --load "$HOME/.local/share/ocicl/ocicl-runtime.lisp" \
            --eval '(asdf:initialize-source-registry (list :source-registry (list :directory (uiop:getcwd)) :inherit-configuration))' \
            --eval '(asdf:load-system :libcurl)' \
            --eval '(format t "~&libcurl ~A at ~A~%protocols: ~A~%features: ~A~%" (libcurl:libcurl-version) (libcurl:libcurl-pathname) (libcurl:libcurl-protocols) (libcurl:libcurl-features))'

      # Built before the tests, because the CLI suite runs the real binary and
      # skips the end-to-end cases when it is missing.
      - name: Build the executable
        run: |
          sbcl --non-interactive \
            --load "$HOME/.local/share/ocicl/ocicl-runtime.lisp" \
            --eval '(asdf:initialize-source-registry (list :source-registry (list :directory (uiop:getcwd)) :inherit-configuration))' \
            --eval '(asdf:make :libcurl/cli)'
          ./bin/curlcl -V
          ./bin/curlcl -s -o /dev/null -w 'smoke: %{http_code} in %{time_total}s\n' https://example.com/

      - name: Run tests
        run: |
          sbcl --non-interactive \
            --load "$HOME/.local/share/ocicl/ocicl-runtime.lisp" \
            --eval '(asdf:initialize-source-registry (list :source-registry (list :directory (uiop:getcwd)) :inherit-configuration))' \
            --eval '(asdf:load-system :libcurl/test)' \
            --eval '(uiop:quit (if (libcurl/test:run-tests) 0 1))'

  # Windows runs the same suite as the Unix jobs.  It is a separate job rather
  # than a matrix entry because everything around the tests differs: SBCL comes
  # from Chocolatey, the C toolchain and libffi and libcurl from MSYS2, and the
  # steps are PowerShell.  What it catches is real -- curl_socket_t is a
  # different width here, standard output is a handle rather than a descriptor,
  # and CRLF checkouts break FORMAT's line-continuation directive.
  windows:
    name: sbcl · windows-latest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install SBCL
        shell: pwsh
        run: choco install sbcl --no-progress -y

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libffi
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-pkg-config

      - name: Put the MinGW toolchain and DLLs on PATH
        shell: pwsh
        run: |
          echo "D:\a\_temp\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\Program Files\Steel Bank Common Lisp" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Report what is available
        shell: pwsh
        run: |
          sbcl --version
          gcc --version
          pkg-config --modversion libffi
          Get-ChildItem D:\a\_temp\msys64\mingw64\bin\libcurl*.dll

      - name: Install and configure ocicl
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/ocicl/ocicl.git $env:USERPROFILE\ocicl-src
          cd $env:USERPROFILE\ocicl-src
          sbcl --non-interactive --load setup.lisp
          # setup.lisp does not put ocicl on PATH on Windows, and where it
          # lands differs from Unix, so find it rather than guess.
          $found = Get-ChildItem -Path $env:USERPROFILE, $env:LOCALAPPDATA -Filter "ocicl*.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $found) { Write-Host "ocicl executable not found after setup"; Get-ChildItem -Path $env:USERPROFILE -Recurse -Filter "ocicl*" -ErrorAction SilentlyContinue | Select-Object -First 20 FullName; exit 1 }
          Write-Host "ocicl at $($found.FullName)"
          echo "$($found.DirectoryName)" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Restore dependencies
        shell: pwsh
        run: |
          ocicl setup
          ocicl install

      - name: Load the system
        shell: pwsh
        run: |
          sbcl --non-interactive `
            --load "$env:USERPROFILE\AppData\Local\ocicl\ocicl-runtime.lisp" `
            --eval '(asdf:initialize-source-registry (list :source-registry (list :directory (uiop:getcwd)) :inherit-configuration))' `
            --eval '(asdf:load-system :libcurl)' `
            --eval '(format t "~&libcurl ~A at ~A~%" (libcurl:libcurl-version) (libcurl:libcurl-pathname))'

      # Same reason as the Unix jobs: the CLI suite runs the real binary and
      # skips its end-to-end cases when there isn't one.
      - name: Build the executable
        shell: pwsh
        run: |
          sbcl --non-interactive `
            --load "$env:USERPROFILE\AppData\Local\ocicl\ocicl-runtime.lisp" `
            --eval '(asdf:initialize-source-registry (list :source-registry (list :directory (uiop:getcwd)) :inherit-configuration))' `
            --eval '(asdf:make :libcurl/cli)'
          Get-ChildItem bin
          $exe = (Get-ChildItem bin\curlcl* | Select-Object -First 1).FullName
          & $exe -V
          # Verbose and allowed to fail: the point is to see what the driver
          # says on stderr, which is the part the test suite cannot show when
          # every case fails at once.
          & $exe -v -o NUL -w 'smoke: %{http_code} in %{time_total}s' https://example.com/
          Write-Host "smoke exit: $LASTEXITCODE"

      - name: Run tests
        shell: pwsh
        run: |
          sbcl --non-interactive `
            --load "$env:USERPROFILE\AppData\Local\ocicl\ocicl-runtime.lisp" `
            --eval '(asdf:initialize-source-registry (list :source-registry (list :directory (uiop:getcwd)) :inherit-configuration))' `
            --eval '(asdf:load-system :libcurl/test)' `
            --eval '(uiop:quit (if (libcurl/test:run-tests) 0 1))'
