# Linux is one of three platform workflows -- ci-linux.yml, ci-macos.yml and
# ci-windows.yml -- rather than a matrix in one file, so that each platform
# gets its own status badge.  GitHub's badge endpoint reports a whole
# workflow and silently ignores a ?job= parameter, so a matrix leg cannot be
# badged on its own; splitting the files is the only way to make the three
# badges in README.md mean what they appear to mean.
#
# What this one is for: libcurl's setopt/getinfo are variadic, and x86-64
# SysV passes a variadic argument in registers where Darwin arm64 passes it
# on the stack.  macOS is what proves the variadic path in src/varargs.lisp is
# necessary at all; this job proves it did not break the case that would have
# worked without it.
#
# Both architectures, because they are not the same test.  AAPCS64 passes a
# variadic argument in registers like a named one; Apple's arm64 ABI departs
# from it and puts them on the stack.  arm64-on-Linux is therefore what
# separates "arm64" from "Darwin": a break on this leg *and* macOS is about
# the instruction set, one on macOS alone is about Apple's calling convention.
# Without it the two are confounded and a variadic bug here reads as a Linux
# bug.  It is also the architecture the release workflow ships a linux-arm64
# binary for, which until now was built and never tested.

name: Linux

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: sbcl · ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # Both legs run to completion: which architectures fail is the diagnosis
      # above, and cancelling the survivor throws that away.
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v5

      - name: Install SBCL and libcurl
        run: |
          sudo apt-get update
          # No libffi-dev or pkg-config: nothing here is groveled or compiled,
          # so the build needs no C toolchain at all.
          sudo apt-get install -y sbcl libcurl4-openssl-dev

      - name: Install and configure ocicl
        run: |
          # Clone the ocicl *tool* outside the repo so it does not collide with
          # this project's gitignored ocicl/ dependency directory.
          git clone --depth 1 https://github.com/ocicl/ocicl.git "$HOME/ocicl-src"
          ( cd "$HOME/ocicl-src" && sbcl --non-interactive --load setup.lisp )
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore dependencies
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ocicl setup
          ocicl install

      - name: Report which libcurl was loaded
        # Worth its own step: the binding feature-gates on the loaded library,
        # so when a test skips, this says why.
        run: |
          sbcl --non-interactive \
            --load "$HOME/.local/share/ocicl/ocicl-runtime.lisp" \
            --eval '(asdf:initialize-source-registry (list :source-registry (list :directory (uiop:getcwd)) :inherit-configuration))' \
            --eval '(asdf:load-system :curlcl)' \
            --eval '(format t "~&libcurl ~A at ~A~%protocols: ~A~%features: ~A~%" (curlcl:libcurl-version) (curlcl:libcurl-pathname) (curlcl:libcurl-protocols) (curlcl:libcurl-features))'

      # Built before the tests, because the CLI suite runs the real binary and
      # skips the end-to-end cases when it is missing.
      - name: Build the executable
        run: |
          sbcl --non-interactive \
            --load "$HOME/.local/share/ocicl/ocicl-runtime.lisp" \
            --eval '(asdf:initialize-source-registry (list :source-registry (list :directory (uiop:getcwd)) :inherit-configuration))' \
            --eval '(asdf:make :curlcl/cli)'
          ./bin/curlcl -V
          ./bin/curlcl -s -o /dev/null -w 'smoke: %{http_code} in %{time_total}s\n' https://example.com/

      - name: Run tests
        run: |
          sbcl --non-interactive \
            --load "$HOME/.local/share/ocicl/ocicl-runtime.lisp" \
            --eval '(asdf:initialize-source-registry (list :source-registry (list :directory (uiop:getcwd)) :inherit-configuration))' \
            --eval '(asdf:load-system :curlcl/test)' \
            --eval '(uiop:quit (if (curlcl/test:run-tests) 0 1))'

      # The binary this run actually tested, kept so a change can be tried
      # without a local Lisp toolchain.  Not a release: it is bare, so it
      # needs libcurl already on the machine, and it expires.
      # release.yml is the one that bundles and publishes.
      - name: Upload the binary
        uses: actions/upload-artifact@v4
        with:
          name: curlcl-linux-${{ matrix.arch }}-${{ github.sha }}
          path: bin/curlcl
          if-no-files-found: error
          retention-days: 14
